<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="bday.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="header">
            <h1>Today is Wanda's birthday🎉</h1>
            <img src="wanda.jpg" id="pic">
            <h2 id="bday-age">24 years old</h2>
            <h4 id="bday-date">01.11.2005</h4>
        </div>
        <div class="gift">
            <h2 class="gift-title">Here's how happy I am for you today 🥳</h2>
            <h3 class="gift-hint">(Hover over the gift)</h3>
            <div class="gift-img" id="happy"></div>
        </div>
        <div class="gift">
            <h2 class="gift-title">How people react when they see you 😍</h2>
            <div class="gift-img" id="melt"></div>
        </div>
        <div class="gift">
            <h2 class="gift-title">Your Awaken form</h2>
            <div class="gift-img" id="awaken"></div>
        </div>
        <div class="gift">
            <h2 class="gift-title">Your happy form</h2>
            <div class="gift-img" id="fun"></div>
        </div>
        <div class="gift">
            <h2 class="gift-title">We are cheering for you</h2>
            <div class="gift-img" id="cheers"></div>
        </div>
        <p id="footer">Want to create your own card. <a href=href="https://scrimba.com/learn/htmlandcss" target="_blank"> Click here.</a></p>
    </body>
</html>
